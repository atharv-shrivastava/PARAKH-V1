name: Finalize dedicated barcode DataKart integration
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integration
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re

          # ---------- backend/src/ocr/fastRoutes.js ----------
          p = Path('backend/src/ocr/fastRoutes.js')
          s = p.read_text()
          s = s.replace(
              'limits: { files: config.maxImages, fileSize: config.maxImageSizeBytes },',
              'limits: { files: config.maxImages + 1, fileSize: config.maxImageSizeBytes },', 1)
          s = s.replace(
              'async function handleFastAnalyze(req, res, files) {',
              'async function handleFastAnalyze(req, res, files, barcodeFile = null) {', 1)
          if 'const barcodeImageProvided = Boolean(barcodeFile);' not in s:
              s = s.replace(
                  '    const uploadMs = Date.now() - startedAt;\n    const rapidStart = Date.now();',
                  '    const barcodeImageProvided = Boolean(barcodeFile);\n    const submittedBarcode = String(req.body?.barcodeGtin || "").replace(/\\D/g, "").trim();\n    const uploadMs = Date.now() - startedAt;\n    const rapidStart = Date.now();', 1)
          old = '    const result = await applyEvidenceConfidence(buildStructuredResult(rapid, aiSemantic));'
          if old in s:
              s = s.replace(old, '''    const structuredResult = buildStructuredResult(rapid, aiSemantic);\n    if (submittedBarcode) {\n      structuredResult.barcode = {\n        value: submittedBarcode,\n        raw: submittedBarcode,\n        confidence: 1,\n        evidence: submittedBarcode,\n        status: "found",\n        source: "BARCODE_IMAGE_DECODER",\n      };\n    }\n    const result = await applyEvidenceConfidence(structuredResult, { barcodeImageProvided });''', 1)
          if 'upload.fields([' not in s:
              route_re = re.compile(r'''  \} finally \{\n    await Promise\.all\(files\.map\(\(file\) => fs\.unlink\(file\.path\)\.catch\(\(\) => \{\}\)\)\);\n  \}\n\}\n\nrouter\.post\("/analyze", authenticate, upload\.array\("images", config\.maxImages\), \(req, res\) => handleFastAnalyze\(req, res, req\.files \|\| \[\]\)\);''')
              replacement = '''  } finally {\n    await Promise.all([\n      ...files.map((file) => fs.unlink(file.path).catch(() => {})),\n      ...(barcodeFile ? [fs.unlink(barcodeFile.path).catch(() => {})] : []),\n    ]);\n  }\n}\n\nrouter.post("/analyze", authenticate, upload.fields([\n  { name: "images", maxCount: config.maxImages },\n  { name: "barcodeImage", maxCount: 1 },\n]), (req, res) => {\n  const packageFiles = Array.isArray(req.files?.images) ? req.files.images : [];\n  const barcodeFile = Array.isArray(req.files?.barcodeImage) ? req.files.barcodeImage[0] : null;\n  return handleFastAnalyze(req, res, packageFiles, barcodeFile);\n});'''
              ns, count = route_re.subn(replacement, s, count=1)
              if count != 1:
                  raise SystemExit('Could not patch OCR upload route')
              s = ns
          p.write_text(s)

          # ---------- backend/src/ocr/evidenceConfidence.js ----------
          p = Path('backend/src/ocr/evidenceConfidence.js')
          s = p.read_text()
          if 'options = {}' not in s[s.find('export async function applyEvidenceConfidence'):s.find('export async function applyEvidenceConfidence')+120]:
              s = s.replace(
                  'export async function applyEvidenceConfidence(result) {',
                  'export async function applyEvidenceConfidence(result, options = {}) {\n  const barcodeImageProvided = Boolean(options?.barcodeImageProvided);', 1)
          s = s.replace(
              '  const rapidBarcode = extractGtinFromRapidEvidence(evidence);',
              '  const rapidBarcode = barcodeImageProvided ? null : extractGtinFromRapidEvidence(evidence);', 1)
          p.write_text(s)

          # ---------- frontend/src/pages/Scan.jsx ----------
          p = Path('frontend/src/pages/Scan.jsx')
          s = p.read_text()
          if 'const [barcodeImage, setBarcodeImage] = useState(null);' not in s:
              s = s.replace(
                  '  const [images, setImages] = useState([]);\n  const [ocr, setOcr] = useState(null);',
                  '  const [images, setImages] = useState([]);\n  const [barcodeImage, setBarcodeImage] = useState(null);\n  const [ocr, setOcr] = useState(null);', 1)
          if 'async function decodeBarcodeImage(file)' not in s:
              cleanup = '''  useEffect(() => {\n    return () => {\n      images.forEach((item) => {\n        if (item?.url) URL.revokeObjectURL(item.url);\n      });\n    };\n  }, [images]);'''
              cleanup_new = cleanup + '''\n\n  useEffect(() => {\n    return () => {\n      if (barcodeImage?.url) URL.revokeObjectURL(barcodeImage.url);\n    };\n  }, [barcodeImage]);'''
              if cleanup not in s:
                  raise SystemExit('Could not locate image cleanup effect')
              s = s.replace(cleanup, cleanup_new, 1)
              marker = '''  function handleImages(event) {\n    addFiles(event.target.files);\n    event.target.value = "";\n  }\n\n  async function openCamera() {'''
              insert = '''  function handleImages(event) {\n    addFiles(event.target.files);\n    event.target.value = "";\n  }\n\n  function handleBarcodeImage(event) {\n    const file = Array.from(event.target.files || []).find((item) => item instanceof File && item.type.startsWith("image/"));\n    event.target.value = "";\n    if (!file) return;\n    setBarcodeImage((current) => {\n      if (current?.url) URL.revokeObjectURL(current.url);\n      return { file, url: URL.createObjectURL(file) };\n    });\n    setOcr(null);\n    setCompliance(null);\n    setAcceptedFindingIds([]);\n    setComplianceError(null);\n    setShowRegistration(false);\n    setUseExtractedData(false);\n    setForm(emptyForm);\n    setMessage("Barcode image ready. It will be decoded separately for GTIN/DataKart verification when Analyze Images is clicked.");\n  }\n\n  function removeBarcodeImage() {\n    setBarcodeImage((current) => {\n      if (current?.url) URL.revokeObjectURL(current.url);\n      return null;\n    });\n    setOcr(null);\n    setCompliance(null);\n    setAcceptedFindingIds([]);\n    setComplianceError(null);\n  }\n\n  async function decodeBarcodeImage(file) {\n    if (!("BarcodeDetector" in globalThis)) {\n      throw new Error("Barcode scanning is not supported by this browser. Use a Chromium browser with BarcodeDetector support.");\n    }\n    const supported = typeof BarcodeDetector.getSupportedFormats === "function"\n      ? await BarcodeDetector.getSupportedFormats()\n      : [];\n    const formats = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "itf", "codabar", "qr_code", "data_matrix"]\n      .filter((format) => !supported.length || supported.includes(format));\n    const detector = new BarcodeDetector(formats.length ? { formats } : undefined);\n    const detected = await detector.detect(file);\n    const raw = detected.find((item) => String(item?.rawValue || "").replace(/\\D/g, "").length >= 8)?.rawValue || detected[0]?.rawValue || "";\n    const digits = String(raw).replace(/\\D/g, "");\n    return [digits, digits.length === 12 ? `0${digits}` : ""].find((value) => /^(?:\\d{8}|\\d{12}|\\d{13}|\\d{14})$/.test(value)) || "";\n  }\n\n  async function openCamera() {'''
              if marker not in s:
                  raise SystemExit('Could not locate image handler section')
              s = s.replace(marker, insert, 1)
          if 'formData.append("barcodeImage", barcodeImage.file);' not in s:
              form_marker = '''    try {\n      let extracted;\n      try {\n        const formData = new FormData();\n        images.forEach(({ file }) => formData.append("images", file));\n        formData.append("categoryOptions", JSON.stringify(finalCategories.map((item) => ({ id: item.id, name: item.name, path: item.path.map((x) => x.name).join(" → ") }))));'''
              form_new = '''    try {\n      let extracted;\n      let barcodeGtin = "";\n      if (barcodeImage) {\n        setMessage("Decoding dedicated barcode image for GTIN...");\n        try {\n          barcodeGtin = await decodeBarcodeImage(barcodeImage.file);\n          setMessage(barcodeGtin\n            ? `Barcode decoded: GTIN ${barcodeGtin}. Running package OCR and DataKart verification...`\n            : "Barcode image could not be decoded. Continuing package analysis.");\n        } catch (barcodeError) {\n          setMessage(`Barcode decoding unavailable: ${barcodeError.message}`);\n        }\n      }\n      try {\n        const formData = new FormData();\n        images.forEach(({ file }) => formData.append("images", file));\n        if (barcodeImage) formData.append("barcodeImage", barcodeImage.file);\n        if (barcodeGtin) formData.append("barcodeGtin", barcodeGtin);\n        formData.append("categoryOptions", JSON.stringify(finalCategories.map((item) => ({ id: item.id, name: item.name, path: item.path.map((x) => x.name).join(" → ") }))));'''
              if form_marker not in s:
                  raise SystemExit('Could not locate Analyze Images form data block')
              s = s.replace(form_marker, form_new, 1)
          if '<h2>Upload Barcode</h2>' not in s:
              ui_marker = '''    <section className="scan-area"><div className="scan-icon">⌁</div><h2>Capture or upload package images</h2><p>Use the camera or choose up to {MAX_IMAGES} images showing different sides of the package.</p><div className="scan-upload-actions"><button type="button" className="primary-button" onClick={openCamera}>Open Camera</button><label className="secondary-button scan-file-button">Upload Images<input type="file" accept="image/*" multiple onChange={handleImages} hidden /></label></div><p className="scan-limit">{images.length}/{MAX_IMAGES} images selected</p>{cameraError && <div className="status-message">{cameraError}</div>}</section>'''
              ui_new = ui_marker + '''\n    <section className="scan-area" style={{ marginTop: 16 }}><div className="scan-icon">▥</div><h2>Upload Barcode</h2><p>Upload a clear barcode image separately. Parakh decodes it for the GTIN and uses the GTIN to verify the product in DataKart.</p><div className="scan-upload-actions"><label className="secondary-button scan-file-button">{barcodeImage ? "Replace Barcode" : "Upload Barcode"}<input type="file" accept="image/*" onChange={handleBarcodeImage} hidden /></label>{barcodeImage && <button type="button" className="secondary-button" onClick={removeBarcodeImage}>Remove</button>}</div>{barcodeImage && <div style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}><img src={barcodeImage.url} alt="Uploaded barcode" style={{ width: 180, maxHeight: 100, objectFit: "contain", borderRadius: 8, border: "1px solid #d1d5db", background: "#fff" }} /><span style={{ fontSize: 13, fontWeight: 700 }}>{barcodeImage.file.name}<br /><small style={{ fontWeight: 500, opacity: 0.75 }}>Decoded when Analyze Images is clicked.</small></span></div>}</section>'''
              if ui_marker not in s:
                  raise SystemExit('Could not locate package upload section')
              s = s.replace(ui_marker, ui_new, 1)
          p.write_text(s)
          PY

          rm -f .github/workflows/one-shot-barcode-datakart.yml .github/workflows/barcode-datakart-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/ocr/fastRoutes.js backend/src/ocr/evidenceConfidence.js frontend/src/pages/Scan.jsx .github/workflows/one-shot-barcode-datakart.yml .github/workflows/barcode-datakart-finalize.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: use separate barcode image for GTIN DataKart verification"
          git push origin HEAD:main
