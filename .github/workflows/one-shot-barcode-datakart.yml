name: One-shot barcode DataKart integration
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch barcode pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Backend: accept a dedicated barcode image and the GTIN decoded by the UI.
          fast = Path("backend/src/ocr/fastRoutes.js")
          text = fast.read_text()
          text = text.replace(
              'limits: { files: config.maxImages, fileSize: config.maxImageSizeBytes },',
              'limits: { files: config.maxImages + 1, fileSize: config.maxImageSizeBytes },', 1)
          text = text.replace(
              'async function handleFastAnalyze(req, res, files) {',
              'async function handleFastAnalyze(req, res, files, barcodeFile = null) {', 1)
          text = text.replace(
              '    const startedAt = Date.now();\n    try {',
              '    const startedAt = Date.now();\n    try {', 1)
          old = '''    const uploadMs = Date.now() - startedAt;\n    const rapidStart = Date.now();'''
          new = '''    const barcodeImageProvided = Boolean(barcodeFile);\n    const submittedBarcode = String(req.body?.barcodeGtin || "").replace(/\\D/g, "").trim();\n    const uploadMs = Date.now() - startedAt;\n    const rapidStart = Date.now();'''
          if old not in text:
              raise SystemExit("Backend upload timing pattern not found")
          text = text.replace(old, new, 1)
          old = '''    const result = await applyEvidenceConfidence(buildStructuredResult(rapid, aiSemantic));'''
          new = '''    const structuredResult = buildStructuredResult(rapid, aiSemantic);\n    if (submittedBarcode) {\n      structuredResult.barcode = {\n        value: submittedBarcode,\n        raw: submittedBarcode,\n        confidence: 1,\n        evidence: submittedBarcode,\n        status: "found",\n        source: "BARCODE_IMAGE_DECODER",\n      };\n    }\n    const result = await applyEvidenceConfidence(structuredResult, { barcodeImageProvided });'''
          if old not in text:
              raise SystemExit("Backend result construction pattern not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              '`[ocr:fast] images=${files.length} evidence=${rapid.evidence.length} rapid=${rapidMs}ms `',
              '`[ocr:fast] images=${files.length} barcodeImage=${barcodeImageProvided ? "yes" : "no"} gtin=${submittedBarcode || "none"} evidence=${rapid.evidence.length} rapid=${rapidMs}ms `', 1)
          old = '''  } finally {\n    await Promise.all(files.map((file) => fs.unlink(file.path).catch(() => {})));\n  }\n}\n\nrouter.post("/analyze", authenticate, upload.array("images", config.maxImages), (req, res) => handleFastAnalyze(req, res, req.files || []));'''
          new = '''  } finally {\n    await Promise.all([\n      ...files.map((file) => fs.unlink(file.path).catch(() => {})),\n      ...(barcodeFile ? [fs.unlink(barcodeFile.path).catch(() => {})] : []),\n    ]);\n  }\n}\n\nrouter.post("/analyze", authenticate, upload.fields([\n  { name: "images", maxCount: config.maxImages },\n  { name: "barcodeImage", maxCount: 1 },\n]), (req, res) => {\n  const packageFiles = Array.isArray(req.files?.images) ? req.files.images : [];\n  const barcodeFile = Array.isArray(req.files?.barcodeImage) ? req.files.barcodeImage[0] : null;\n  return handleFastAnalyze(req, res, packageFiles, barcodeFile);\n});'''
          if old not in text:
              raise SystemExit("Backend route/finally pattern not found")
          text = text.replace(old, new, 1)
          fast.write_text(text)

          # Evidence layer: a submitted barcode image is authoritative for barcode lookup;
          # do not silently substitute an unrelated OCR number if barcode decoding failed.
          ev = Path("backend/src/ocr/evidenceConfidence.js")
          text = ev.read_text()
          replace_old = 'export async function applyEvidenceConfidence(result) {'
          replace_new = 'export async function applyEvidenceConfidence(result, options = {}) {\n  const barcodeImageProvided = Boolean(options?.barcodeImageProvided);'
          if replace_old not in text:
              raise SystemExit("Evidence function signature not found")
          text = text.replace(replace_old, replace_new, 1)
          text = text.replace(
              '  const rapidBarcode = extractGtinFromRapidEvidence(evidence);',
              '  const rapidBarcode = barcodeImageProvided ? null : extractGtinFromRapidEvidence(evidence);', 1)
          old = '''  const dataKartStatus = dataKart ? "REGISTERED" : dataKartError ? "UNAVAILABLE" : barcode ? "NOT_FOUND" : "NO_GTIN";\n  const dataKartMessage = dataKart ? "✓ Product found in DataKart" : dataKartError ? "? DataKart could not be reached" : barcode ? "✕ Product not found in DataKart" : "✕ Product not detected in DataKart";'''
          new = '''  const dataKartStatus = dataKart\n    ? "REGISTERED"\n    : dataKartError\n      ? "UNAVAILABLE"\n      : barcodeImageProvided && !barcode\n        ? "BARCODE_UNREADABLE"\n        : barcode\n          ? "NOT_FOUND"\n          : "NO_GTIN";\n  const dataKartMessage = dataKart\n    ? "✓ Product found in DataKart"\n    : dataKartError\n      ? "? DataKart could not be reached"\n      : dataKartStatus === "BARCODE_UNREADABLE"\n        ? "? Barcode could not be decoded"\n        : barcode\n          ? "✕ Product not found in DataKart"\n          : "✕ Product not detected in DataKart";'''
          if old not in text:
              raise SystemExit("Evidence DataKart status pattern not found")
          text = text.replace(old, new, 1)
          ev.write_text(text)

          # Frontend: separate barcode image upload + decode via the browser barcode detector,
          # then send the decoded GTIN to the same OCR endpoint for DataKart verification.
          scan = Path("frontend/src/pages/Scan.jsx")
          text = scan.read_text()
          text = text.replace(
              '  const [images, setImages] = useState([]);\n  const [ocr, setOcr] = useState(null);',
              '  const [images, setImages] = useState([]);\n  const [barcodeImage, setBarcodeImage] = useState(null);\n  const [ocr, setOcr] = useState(null);', 1)
          old = '''  useEffect(() => {\n    return () => {\n      images.forEach((item) => {\n        if (item?.url) URL.revokeObjectURL(item.url);\n      });\n    };\n  }, [images]);'''
          new = '''  useEffect(() => {\n    return () => {\n      images.forEach((item) => {\n        if (item?.url) URL.revokeObjectURL(item.url);\n      });\n    };\n  }, [images]);\n\n  useEffect(() => {\n    return () => {\n      if (barcodeImage?.url) URL.revokeObjectURL(barcodeImage.url);\n    };\n  }, [barcodeImage]);'''
          if old not in text:
              raise SystemExit("Frontend image cleanup pattern not found")
          text = text.replace(old, new, 1)
          marker = '''  function handleImages(event) {\n    addFiles(event.target.files);\n    event.target.value = "";\n  }\n\n  async function openCamera() {'''
          insert = '''  function handleImages(event) {\n    addFiles(event.target.files);\n    event.target.value = "";\n  }\n\n  function handleBarcodeImage(event) {\n    const file = Array.from(event.target.files || []).find((item) => item instanceof File && item.type.startsWith("image/"));\n    event.target.value = "";\n    if (!file) return;\n    setBarcodeImage((current) => {\n      if (current?.url) URL.revokeObjectURL(current.url);\n      return { file, url: URL.createObjectURL(file) };\n    });\n    setOcr(null);\n    setCompliance(null);\n    setAcceptedFindingIds([]);\n    setComplianceError(null);\n    setShowRegistration(false);\n    setUseExtractedData(false);\n    setForm(emptyForm);\n    setMessage("Barcode image ready. It will be decoded separately for GTIN/DataKart verification when Analyze Images is clicked.");\n  }\n\n  function removeBarcodeImage() {\n    setBarcodeImage((current) => {\n      if (current?.url) URL.revokeObjectURL(current.url);\n      return null;\n    });\n    setOcr(null);\n    setCompliance(null);\n    setAcceptedFindingIds([]);\n    setComplianceError(null);\n  }\n\n  async function decodeBarcodeImage(file) {\n    if (!("BarcodeDetector" in globalThis)) {\n      throw new Error("Barcode scanning is not supported by this browser. Use a Chromium browser with BarcodeDetector support.");\n    }\n    const supported = typeof BarcodeDetector.getSupportedFormats === "function"\n      ? await BarcodeDetector.getSupportedFormats()\n      : [];\n    const preferredFormats = [\n      "ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "itf", "codabar", "qr_code", "data_matrix"\n    ].filter((format) => !supported.length || supported.includes(format));\n    const detector = new BarcodeDetector(preferredFormats.length ? { formats: preferredFormats } : undefined);\n    const detected = await detector.detect(file);\n    const raw = detected.find((item) => String(item?.rawValue || "").replace(/\\D/g, "").length >= 8)?.rawValue || detected[0]?.rawValue || "";\n    const digits = String(raw).replace(/\\D/g, "");\n    return [digits, digits.length === 12 ? `0${digits}` : ""].find((value) => /^(?:\\d{8}|\\d{12}|\\d{13}|\\d{14})$/.test(value)) || "";\n  }\n\n  async function openCamera() {'''
          if marker not in text:
              raise SystemExit("Frontend handler insertion marker not found")
          text = text.replace(marker, insert, 1)

          old = '''    try {\n      let extracted;\n      try {\n        const formData = new FormData();\n        images.forEach(({ file }) => formData.append("images", file));\n        formData.append("categoryOptions", JSON.stringify(finalCategories.map((item) => ({ id: item.id, name: item.name, path: item.path.map((x) => x.name).join(" → ") }))));'''
          new = '''    try {\n      let extracted;\n      let barcodeGtin = "";\n      if (barcodeImage) {\n        setMessage("Decoding dedicated barcode image for GTIN...");\n        try {\n          barcodeGtin = await decodeBarcodeImage(barcodeImage.file);\n          if (barcodeGtin) {\n            setMessage(`Barcode decoded: GTIN ${barcodeGtin}. Running package OCR and DataKart verification...`);\n          } else {\n            setMessage("Barcode image could not be decoded. Continuing package analysis; DataKart will show that the barcode was unreadable.");\n          }\n        } catch (barcodeError) {\n          setMessage(`Barcode decoding unavailable: ${barcodeError.message}`);\n        }\n      }\n      try {\n        const formData = new FormData();\n        images.forEach(({ file }) => formData.append("images", file));\n        if (barcodeImage) formData.append("barcodeImage", barcodeImage.file);\n        if (barcodeGtin) formData.append("barcodeGtin", barcodeGtin);\n        formData.append("categoryOptions", JSON.stringify(finalCategories.map((item) => ({ id: item.id, name: item.name, path: item.path.map((x) => x.name).join(" → ") }))));'''
          if old not in text:
              raise SystemExit("Frontend analyze form pattern not found")
          text = text.replace(old, new, 1)

          old = '''    <section className="scan-area"><div className="scan-icon">⌁</div><h2>Capture or upload package images</h2><p>Use the camera or choose up to {MAX_IMAGES} images showing different sides of the package.</p><div className="scan-upload-actions"><button type="button" className="primary-button" onClick={openCamera}>Open Camera</button><label className="secondary-button scan-file-button">Upload Images<input type="file" accept="image/*" multiple onChange={handleImages} hidden /></label></div><p className="scan-limit">{images.length}/{MAX_IMAGES} images selected</p>{cameraError && <div className="status-message">{cameraError}</div>}</section>'''
          new = '''    <section className="scan-area"><div className="scan-icon">⌁</div><h2>Capture or upload package images</h2><p>Use the camera or choose up to {MAX_IMAGES} images showing different sides of the package.</p><div className="scan-upload-actions"><button type="button" className="primary-button" onClick={openCamera}>Open Camera</button><label className="secondary-button scan-file-button">Upload Images<input type="file" accept="image/*" multiple onChange={handleImages} hidden /></label></div><p className="scan-limit">{images.length}/{MAX_IMAGES} images selected</p>{cameraError && <div className="status-message">{cameraError}</div>}</section>\n    <section className="scan-area" style={{ marginTop: 16 }}><div className="scan-icon">▥</div><h2>Upload Barcode</h2><p>Upload a clear image of the product barcode. Parakh decodes this image separately to obtain the GTIN, then uses that GTIN to verify the product in DataKart.</p><div className="scan-upload-actions"><label className="secondary-button scan-file-button">{barcodeImage ? "Replace Barcode" : "Upload Barcode"}<input type="file" accept="image/*" onChange={handleBarcodeImage} hidden /></label>{barcodeImage && <button type="button" className="secondary-button" onClick={removeBarcodeImage}>Remove</button>}</div>{barcodeImage && <div style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}><img src={barcodeImage.url} alt="Uploaded barcode" style={{ width: 180, maxHeight: 100, objectFit: "contain", borderRadius: 8, border: "1px solid #d1d5db", background: "#fff" }} /><span style={{ fontSize: 13, fontWeight: 700 }}>{barcodeImage.file.name}<br /><small style={{ fontWeight: 500, opacity: 0.75 }}>Decoded when Analyze Images is clicked.</small></span></div>}</section>'''
          if old not in text:
              raise SystemExit("Frontend upload UI pattern not found")
          text = text.replace(old, new, 1)

          scan.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/ocr/fastRoutes.js backend/src/ocr/evidenceConfidence.js frontend/src/pages/Scan.jsx
          git commit -m "feat: use separate barcode image for GTIN DataKart verification"
          git push origin HEAD:main
          rm -f .github/workflows/one-shot-barcode-datakart.yml
          git add .github/workflows/one-shot-barcode-datakart.yml
          git commit -m "chore: remove one-shot barcode patch workflow"
          git push origin HEAD:main
